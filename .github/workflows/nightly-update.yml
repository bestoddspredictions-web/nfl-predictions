
name: Nightly NFL Data Update

# Grant the workflow write access so the checkout/GITHUB_TOKEN can push commits
permissions:
  contents: write

on:
  schedule:
    # Run at 3:00 AM UTC daily during football season (Sept 1 - Feb 15)
    - cron: '0 3 * 9-12,1-2 *'  # Sept-Dec and Jan-Feb
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    
    # Only run during football season (Sept 1 - Feb 15)
    if: |
      (github.event_name == 'workflow_dispatch') || 
      ((github.event.schedule == '0 3 * 9-12,1-2 *') && 
       ((github.event_name == 'schedule' && 
         ((startsWith(github.run_number, '9') || 
           startsWith(github.run_number, '10') || 
           startsWith(github.run_number, '11') || 
           startsWith(github.run_number, '12') || 
           startsWith(github.run_number, '1') || 
           startsWith(github.run_number, '2')) || 
          true))))
    
    steps:
      - name: Check if in football season
        id: season_check
        run: |
          CURRENT_MONTH=$(date +%-m)
          CURRENT_DAY=$(date +%-d)
          
          # Football season: Sept 1 (month 9) through Feb 15 (month 2, day 15)
          if [ $CURRENT_MONTH -ge 9 ] || [ $CURRENT_MONTH -le 2 ]; then
            if [ $CURRENT_MONTH -eq 2 ] && [ $CURRENT_DAY -gt 15 ]; then
              echo "Outside football season (after Feb 15)"
              echo "in_season=false" >> $GITHUB_OUTPUT
            else
              echo "In football season"
              echo "in_season=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Outside football season (March-August)"
            echo "in_season=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout repository
        if: steps.season_check.outputs.in_season == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false  # Skip LFS to avoid bandwidth limits (data regenerated in workflow)
      
      - name: Set up Python 3.12
        if: steps.season_check.outputs.in_season == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Cache historical play-by-play data (2020-2024)
        if: steps.season_check.outputs.in_season == 'true'
        uses: actions/cache@v4
        with:
          path: data_files/nfl_play_by_play_historical_2020_2024.csv.gz
          key: pbp-historical-2020-2024-v1
          restore-keys: |
            pbp-historical-2020-2024-
      
      - name: Update play-by-play data
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          echo "Smart update of play-by-play data..."
          python update_pbp_smart.py
        continue-on-error: true  # Don't fail if NFLverse is temporarily down
      
      - name: Run prediction pipeline
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          echo "Running build and train pipeline..."
          python build_and_train_pipeline.py
        timeout-minutes: 30  # Pipeline takes ~5 min but allow buffer

      - name: Retrain player prop models
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          echo "Retraining player prop models..."
          python player_props/train_models.py --skip-aggregation
        timeout-minutes: 20
        continue-on-error: true  # Don't fail nightly run if prop retraining fails

      - name: Generate fresh player prop predictions
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          echo "Generating player prop predictions..."
          python player_props/predict.py
        timeout-minutes: 20
        continue-on-error: true
      
      - name: Upload updated predictions
        if: steps.season_check.outputs.in_season == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-predictions-${{ github.run_number }}
          path: |
            data_files/nfl_games_historical_with_predictions.csv
            data_files/model_metrics.json
            data_files/model_feature_importances.csv
            data_files/betting_recommendations_log.csv
            player_props/models/model_metrics.json
          retention-days: 7
      
      - name: Commit and push changes (optional)
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          git add data_files/*.csv data_files/*.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated nightly update: predictions and ESPN data [skip ci]"
            git push
          fi
        continue-on-error: true  # Don't fail if nothing to commit

      - name: Export best bets for Sports Picks Grid
        if: steps.season_check.outputs.in_season == 'true'
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit best_bets_today.json
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          git add data_files/best_bets_today.json
          git diff --staged --quiet || git commit -m "chore: update best_bets_today [skip ci]"
          git push
        continue-on-error: true
      
      - name: Sync deploy branch with main
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # deploy is what Render actually serves. It deliberately excludes
          # data_files/nfl_play_by_play_historical.csv.gz (a Git LFS pointer
          # on main) to avoid the LFS smudge failures that broke the original
          # Streamlit Cloud deployment. Without this step, deploy only gets
          # tonight's fresh data when a human remembers to merge main into it
          # -- which is exactly what let deploy silently run on stale data
          # for days at a time.
          # The initial checkout is a shallow (depth-1) clone of only the
          # triggering ref (main, for scheduled runs). A real merge across
          # branches needs actual shared history, not a 1-commit sliver, or
          # git may treat every file as conflicting/unrelated. Unshallow and
          # fetch both branches in full before merging.
          git fetch --unshallow origin || git fetch origin  # already-unshallow repos error on --unshallow
          git fetch origin main deploy

          git checkout -B deploy origin/deploy
          # main's own nightly pipeline actively touches the LFS pointer for
          # data_files/nfl_play_by_play_historical.csv.gz, so a plain merge
          # would hit a real conflict on that one path most nights -- not an
          # occasional edge case. Tell git to always prefer deploy's side
          # (i.e. the file's absence) for that path specifically, while
          # merging every other file normally.
          git merge origin/main --no-edit -m "Auto-sync: merge main into deploy [skip ci]" \
            -X ours 2>/tmp/merge_output.log
          MERGE_STATUS=$?
          cat /tmp/merge_output.log

          if [ $MERGE_STATUS -ne 0 ]; then
            # -X ours only resolves *content* conflicts in files that exist
            # on both sides; a genuine structural conflict elsewhere still
            # needs a human. Bail out safely rather than guessing.
            echo "❌ Merge conflict syncing main into deploy that -X ours"
            echo "   couldn't resolve -- leaving deploy unchanged so a human"
            echo "   can resolve this manually. The fresh data still landed"
            echo "   safely on main."
            git merge --abort
            exit 0
          fi

          # Merging main can reintroduce the LFS pointer file if main's tree
          # includes it and nothing on deploy's side removes it again. Make
          # sure it's absent so deploy never regresses back into the LFS
          # problem it exists to avoid.
          if [ -f data_files/nfl_play_by_play_historical.csv.gz ]; then
            git rm --cached data_files/nfl_play_by_play_historical.csv.gz
            rm -f data_files/nfl_play_by_play_historical.csv.gz
            git commit -m "Re-exclude LFS play-by-play file from deploy [skip ci]"
          fi

          git push origin deploy
        continue-on-error: true  # Don't fail the whole run if the sync has issues; main already has the data safely

      - name: Summary
        if: steps.season_check.outputs.in_season == 'true'
        run: |
          echo "✅ Nightly update completed successfully"
          echo "📊 Updated predictions available as artifact: nfl-predictions-${{ github.run_number }}"
          
          # Show some stats
          if [ -f data_files/nfl_games_historical_with_predictions.csv ]; then
            LINES=$(wc -l < data_files/nfl_games_historical_with_predictions.csv)
            echo "📈 Total games in predictions file: $((LINES - 1))"
          fi